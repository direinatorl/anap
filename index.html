<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Minha Favorita</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Auth Screen -->
        <main id="auth-screen" class="screen active">
            <div class="glass-card">
                <div class="card-content">
                    <h1>Olá, quem é você?</h1>
                    <p>Por favor, identifique-se para continuar.</p>
                    <div class="input-group">
                        <input type="text" id="name-input" placeholder="Digite seu nome aqui..." autocomplete="off">
                        <button id="enter-btn">Entrar</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Celebration Screen -->
        <main id="celebration-screen" class="screen">
            <div class="floating-elements" id="particles"></div>
            <div class="content">
                <header class="fade-in">
                    <h2 class="anniversary-text">Dois meses de uma história que está apenas começando...</h2>
                    <h1 class="womens-day-text">Feliz Dia das Mulheres, Minha Vida!</h1>
                </header>

                <section class="romantic-display">
                    <div class="rose-container fade-in-up" style="animation-delay: 0.5s">
                        <div class="flower">
                            <div class="petal"></div>
                            <div class="petal"></div>
                            <div class="petal"></div>
                            <div class="petal"></div>
                            <div class="petal"></div>
                        </div>
                    </div>
                    <div class="dedication fade-in-up" style="animation-delay: 1s">
                        <p>Para a mulher mais incrível do mundo: <strong>Ana Paula</strong>.</p>
                        <p>Cada dia ao seu lado é um presente.</p>
                    </div>
                </section>
            </div>
        </main>

        <!-- Black Screen -->
        <main id="black-screen" class="screen black-out"></main>
    </div>
    <script src="script.js"></script>
</body>

</html>
